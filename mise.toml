[tools]
go = "1.27.0"
node = "24.19.0"

[tasks.test-ts]
description = "Compile and test the TypeScript client/server"
run = "npm test"

[tasks.test-go]
description = "Test the Go funcmap indexer"
run = "go test ./..."
dir = "funcmap"

[tasks.test]
description = "Test both Go and Typescript"
run = [
    "mise run test-go",
    "mise run test-ts"
]

[tasks.build-funcmap]
description = "Cross-compile the Go funcmap indexer for Windows, macOS, and Linux"
dir = "funcmap"
run = [
    "mkdir -p ../bin",
    "CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../bin/gotmpl-funcmap-linux-amd64 .",
    "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../bin/gotmpl-funcmap-linux-arm64 .",
    "CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o ../bin/gotmpl-funcmap-darwin-amd64 .",
    "CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../bin/gotmpl-funcmap-darwin-arm64 .",
    "CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../bin/gotmpl-funcmap-windows-amd64.exe ."
]

[tasks.build-ts]
description = "Compile the TypeScript client and server"
run = "npm run compile"

[tasks.lint]
description = "Lint the TypeScript client and server with ESLint"
run = "npm run lint"

[tasks.format]
description = "Format all sources with Prettier"
run = "npm run format"

[tasks.format-check]
description = "Verify source formatting with Prettier"
run = "npm run format:check"

[tasks.build]
description = "Lint, format-check, and build the Go funcmap binaries and TypeScript client/server"
depends = ["build-funcmap", "build-ts", "lint", "format-check"]

[tasks.package]
description = "Package the extension into a .vsix including pre-built binaries"
depends = ["build"]
run = "npm run package"

[tasks.release]
description = "Bump version, build/package the extension, tag, and publish a GitHub release"
usage = 'arg "<version>" help="Version to release (e.g. 0.1.0)"'
run = [
    'npm version "${usage_version:?}" --no-git-tag-version',
    'git add package.json package-lock.json',
    'git commit -m "Release v${usage_version:?}"',
    'mise run package',
    'git push origin HEAD',
    'git tag "v${usage_version:?}"',
    'git push origin "v${usage_version:?}"',
    'gh release create "v${usage_version:?}" "go-template-lsp-${usage_version:?}.vsix" --title "v${usage_version:?}" --generate-notes',
]
